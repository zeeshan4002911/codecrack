<div 
  id="terminal-view" 
  class="d-flex flex-column"
  
  [ngStyle]="{
    'top': position.top + 'px', 
    'left': position.left + 'px', 
    'width': size.width + 'px', 
    'height': size.height + 'px'
  }"
>

  <!-- Header Section -->
  <div
    #terminalHeader
    class="header d-flex justify-content-between py-1 px-2 align-items-center"
    [ngClass]="{
      'header-dark': isDarkMode,
      'header-light': !isDarkMode
    }"
    [ngStyle]="{
      'cursor': selectedLayout === 'separate-window' ? 'move': ''
    }"
    (mousedown)="dragStartHandler($event)"
    (touchstart)="dragStartHandler($event)"
  >
    <div>Terminal</div>
    <div class="terminal-control-container d-flex">
      <button matIconButton>
        <mat-icon
          (click)="runCode()"
          (touchstart)="runCode()"
          [ngClass]="{'run-disable': !workerStatus}"
        >play_arrow</mat-icon>
      </button>
      
      <div>
        @if (terminalControlOverflowSignal()) {
          <button matIconButton [matMenuTriggerFor]="menu" class="d-flex align-items-center justify-content-center">
            <mat-icon class="align-content-center">more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <ng-container *ngTemplateOutlet="terminalControls"></ng-container>
          </mat-menu>
        } @else {
          <ng-container *ngTemplateOutlet="terminalControls"></ng-container>
        }
      </div>
    </div>
  </div>

  <ng-template #terminalControls>
    <div [class]="'terminal-control d-flex align-items-center justify-content-center ' + (terminalControlOverflowSignal() ? 'flex-column px-2': '')"
    >
      <i 
        (click)="layoutChangeHandler('bottom');layoutChangeHandler('bottom');" 
        (touchstart)="layoutChangeHandler('bottom');layoutChangeHandler('bottom');" 
        class="bi bi-layout-sidebar layout-bottom cursor-pointer"
        [ngClass]="{'active-border': selectedLayout === 'bottom'}"
      ></i>
      <i 
        (click)="layoutChangeHandler('left');layoutChangeHandler('left')" 
        (touchstart)="layoutChangeHandler('left');layoutChangeHandler('left')" 
        class="bi bi-layout-sidebar cursor-pointer"
        [ngClass]="{'active-border': selectedLayout === 'left'}"
      ></i>
      <i 
        (click)="layoutChangeHandler('right');layoutChangeHandler('right');" 
        (touchstart)="layoutChangeHandler('right');layoutChangeHandler('right');" 
        class="bi bi-layout-sidebar-reverse cursor-pointer"
        [ngClass]="{'active-border': selectedLayout === 'right'}"
      ></i>
      <i 
        (click)="layoutChangeHandler('separate-window')" 
        (touchstart)="layoutChangeHandler('separate-window')" 
        class="bi bi-box-arrow-down-left separate-window cursor-pointer"
        [ngClass]="{'active-border': selectedLayout === 'separate-window'}"
      ></i>
      <i 
        class="bi cursor-pointer"
        [ngClass]="{
          'bi-lock': !isResizableEnable,
          'bi-unlock': isResizableEnable
        }"
        (click)="toggleResizeHandler()"
        (touchstart)="toggleResizeHandler()"
      ></i>
    </div>
  </ng-template>

  <!-- Terminal Content -->
  <div 
    class="terminal-content py-1 px-2 flex-grow-1 overflow-scroll"
    [ngClass]="{
      'theme-dark': isDarkMode,
      'theme-light': !isDarkMode
    }"
    [style.fontSize]="terminalFontSize + 'px'"
  >
    <pre class="terminal-output d-block m-0">{{ output }}</pre>
    @if (waitingForInput) {
      <input
        class="px-1 auto-input w-100"
        [style.minWidth]="'fit-content'"
        (keydown.enter)="submit($event)"
        autofocus
      />
    }
  </div>

  <!-- Resizing Handlers -->
  @if(selectedLayout === 'bottom') {
    <div class="resize-handler resize-handler-bottom w-100 position-absolute" (mousedown)="resizeStartHandler($event)"
      (touchstart)="resizeStartHandler($event)"></div>
  }
  @else if(selectedLayout === 'right') {
    <div class="resize-handler resize-handler-right h-100 position-absolute" (mousedown)="resizeStartHandler($event)"
      (touchstart)="resizeStartHandler($event)"></div>
  }
  @else if(selectedLayout === 'left') {
    <div class="resize-handler resize-handler-left h-100 position-absolute" (mousedown)="resizeStartHandler($event)"
      (touchstart)="resizeStartHandler($event)"></div>
  }
  @else if (selectedLayout === 'separate-window') {
    <div class="resize-handler-window d-flex" (mousedown)="resizeStartHandler($event)" 
      (touchstart)="resizeStartHandler($event)">
      <span class="material-icons">south_east</span>
    </div>
  }
</div>
